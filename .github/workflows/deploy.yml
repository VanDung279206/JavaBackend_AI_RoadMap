name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Copy markdown content
        run: |
          mkdir -p website/public/content
          for phase in phases/01_Java phases/02_Http-Sql phases/03_Spring phases/04_Quality phases/05_AI phases/06_RAG; do
            slug=$(basename $phase)
            mkdir -p website/public/content/$slug
            [ -f "$phase/EXERCISES.md" ] && cp "$phase/EXERCISES.md" "website/public/content/$slug/EXERCISES.md"
            [ -f "$phase/SOLUTIONS.md" ] && cp "$phase/SOLUTIONS.md" "website/public/content/$slug/SOLUTIONS.md"
          done

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build
        run: npm run build
        working-directory: website
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ADMIN_GITHUB: VanDung279206

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
