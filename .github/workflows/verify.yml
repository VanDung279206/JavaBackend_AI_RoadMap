name: Verify reference implementations
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline references and tooling
        run: python3 scripts/verify.py --suite offline
      - name: Ensure Docker daemon is running
        run: |
          if sudo systemctl start docker && docker info; then
            echo "Docker daemon is ready."
          else
            echo "::warning::Docker daemon is unavailable; the integration verifier will report Docker-dependent gates as blocked."
          fi
      - name: Spring, PostgreSQL, SQL and Docker HTTP
        run: python3 scripts/verify.py --suite integration
      - name: Website catalogue, permissions and cross-account regression
        shell: bash
        run: |
          set -o pipefail
          mkdir -p checks/runs/database
          python3 -u scripts/check_database.py 2>&1 | tee checks/runs/database/output.log
      - name: Keep verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-verification
          path: checks/runs/
