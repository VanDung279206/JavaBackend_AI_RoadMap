name: Website CI — Lint & Build check

on:
  push:
    branches: [RoadMap_v3, feature/english-learning]
    paths:
      - "website/**"
      - "learning/**"
      - "english/**"
      - "scripts/**"
      - "foundations/**"
      - "advanced/**"
      - "phases/**"
      - "database/**"
      - ".github/workflows/website-ci.yml"
  pull_request:
    paths:
      - "website/**"
      - "learning/**"
      - "english/**"
      - "scripts/**"
      - "foundations/**"
      - "advanced/**"
      - "phases/**"
      - "database/**"
      - ".github/workflows/website-ci.yml"

jobs:
  lint-and-build:
    name: Lint + TypeScript + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate generated catalogue
        working-directory: ${{ github.workspace }}
        run: node scripts/build_catalogue.mjs --check

      - name: Regression tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build (TypeScript check + static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ADMIN_GITHUB: VanDung279206
          NEXT_PUBLIC_BASE_PATH: /JavaBackend_AI_RoadMap

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: English learning browser regressions
        run: npm run test:browser
