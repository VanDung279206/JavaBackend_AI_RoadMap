spring.flyway.locations=classpath:db/migration,classpath:db/vector
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBED_MODEL}
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.retry.max-attempts=1
app.embedding-dimensions=${EMBEDDING_DIMENSIONS}
# Example starting threshold, not a universal quality threshold.
app.min-similarity=${MIN_SIMILARITY:0.2}

spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama

spring.ai.ollama.chat.options.num-predict=512
spring.ai.ollama.embedding.options.truncate=false
