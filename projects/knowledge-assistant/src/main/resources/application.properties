spring.application.name=knowledge-assistant
spring.profiles.default=demo
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.flyway.locations=classpath:db/migration
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.enabled=false
# Required outside the demo profile; never place real passwords in this file.
app.an-password=${APP_AN_PASSWORD}
app.binh-password=${APP_BINH_PASSWORD}

# Keep optional provider auto-configuration off until the real-ai runtime profile.
spring.ai.model.chat=none
spring.ai.model.embedding=none
